<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soirée Blind Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-dark': '#1a1a1a',
              'brand-light': '#F5EFE6',
              'brand-gold': '#D4AF37',
              'brand-burgundy': '#800020',
              'brand-burgundy-dark': '#600018',
            },
            fontFamily: {
              'display': ['Poppins', 'sans-serif'],
              'body': ['Lato', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-in-up': 'slideInUp 0.6s ease-out forwards',
              'glow': 'glow 2.5s infinite ease-in-out',
              'bubbles': 'bubbles 3s ease-in infinite',
              'clink-left': 'clink-and-away-left 3s ease-in-out forwards',
              'clink-right': 'clink-and-away-right 3s ease-in-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideInUp: {
                '0%': { transform: 'translateY(30px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              },
              glow: {
                '0%, 100%': { boxShadow: '0 0 8px #D4AF37, 0 0 12px #D4AF37' },
                '50%': { boxShadow: '0 0 20px #D4AF37, 0 0 30px #D4AF37' },
              },
              bubbles: {
                '0%': { transform: 'translateY(0) scale(1)', opacity: 1 },
                '100%': { transform: 'translateY(-100vh) scale(1.5)', opacity: 0 }
              },
              'clink-and-away-left': {
                '0%': { transform: 'translateX(-100vw) scale(1.5) rotate(-15deg)', opacity: '0' },
                '30%': { transform: 'translateX(-25%) scale(1.5) rotate(-15deg)', opacity: '1' },
                '50%': { transform: 'translateX(-10%) scale(1.5) rotate(-25deg)' },
                '60%': { transform: 'translateX(-15%) scale(1.5) rotate(-15deg)' },
                '100%': { transform: 'translateX(-100vw) scale(1.5) rotate(-30deg)', opacity: '0' },
              },
              'clink-and-away-right': {
                '0%': { transform: 'translateX(100vw) scale(1.5) rotate(15deg)', opacity: '0' },
                '30%': { transform: 'translateX(25%) scale(1.5) rotate(15deg)', opacity: '1' },
                '50%': { transform: 'translateX(10%) scale(1.5) rotate(25deg)' },
                '60%': { transform: 'translateX(15%) scale(1.5) rotate(15deg)' },
                '100%': { transform: 'translateX(100vw) scale(1.5) rotate(30deg)', opacity: '0' },
              }
            }
          }
        }
      }
    </script>

      }

          height: 8px;
      }

          background: rgba(26, 26, 26, 0.5);

      }
      .custom-scrollbar::-webkit-scrollbar-thumb {

          background: #F5EFE6;
      }
    </style>
